<div class="eqed-overlay" id="eqedOverlay" role="dialog" aria-modal="true" aria-labelledby="eqedTitle">

    <div class="eqed-palette" id="eqedPalette" role="tabpanel"></div>

        <label><input type="radio" name="eqedMode" value="raw" />Raw only</label>

        <button type="button" class="eqed-cancel" onclick="EqEditor.close()">Cancel</button>
        <button type="button" class="eqed-ok" onclick="EqEditor.commit()">OK</button>
      </div>
    </div>
  </div>
</div>

    function commit() {
      var latex = getLatex()
      if (!latex || !target) {
        close()
        return
      }
      insertIntoTarget(wrapLatex(latex))
      if (target._eqLivePreview) refreshLivePreview(target)
      if (window.eqTypeset) {
        var host = target.closest ? target.closest('.question-item, .q-list-item, .pc-post, .modal-box, .eqed-field-wrap, form, main, .modal-overlay') || document.body : document.body
        window.eqTypeset([host])
      }
      close()
    }
  
    function refreshLivePreview(field) {
      var box = field._eqLivePreview
      if (!box) return
      var val = field.isContentEditable ? field.innerText : field.value || ''
      if (!val || !/[\$\\]/.test(val)) {
        box.innerHTML = ''
        box.classList.remove('has-content')
        return
      }
      box.textContent = val
      box.classList.add('has-content')
      if (window.eqTypeset) window.eqTypeset([box])
    }
  
    function enhance(field, options) {
      options = options || {}
      if (!field || field._eqEnhanced) return field
      field._eqEnhanced = true
      var wrap = field.closest('.eqed-field-wrap')
      if (!wrap) {
        wrap = document.createElement('div')
        wrap.className = 'eqed-field-wrap'
        field.parentNode.insertBefore(wrap, field)
        wrap.appendChild(field)
      }
      var tools = wrap.querySelector('.eqed-field-tools')
      if (!tools) {
        tools = document.createElement('div')
        tools.className = 'eqed-field-tools'
        wrap.insertBefore(tools, field)
      }
      var alreadyHasBtn = !!(tools.querySelector('.eqed-btn') || (field.id && document.querySelector('[data-eq-target="#' + field.id + '"]')) || (field.parentNode && field.parentNode.querySelector && field.parentNode.querySelector('.eqed-btn, [data-eq-target]')))
      if (!alreadyHasBtn) {
        var btn = document.createElement('button')
        btn.type = 'button'
        btn.className = 'eqed-btn'
        btn.innerHTML = options.buttonLabel || '∑ Math Type'
        btn.addEventListener('mousedown', function (e) {
          e.preventDefault()
          captureSelection(field)
        })
        btn.addEventListener('click', function (e) {
          e.preventDefault()
          open(field)
        })
        tools.appendChild(btn)
      }
      if (options.preview !== false) {
        var prev = wrap.querySelector('.eqed-live-preview')
        if (!prev) {
          prev = document.createElement('div')
          prev.className = 'eqed-live-preview'
          wrap.appendChild(prev)
        }
        field._eqLivePreview = prev
        var onChange = function () {
          refreshLivePreview(field)
        }
        field.addEventListener('input', onChange)
        field.addEventListener('change', onChange)
        refreshLivePreview(field)
      }
      return field
    }
  
    function enhanceAll(root) {
      root = root || document
      root.querySelectorAll('[data-eq-field]').forEach(function (el) {
        enhance(el, {
          preview: el.getAttribute('data-eq-preview') !== '0',
          buttonLabel: el.getAttribute('data-eq-label') || '∑ Math Type'
        })
      })
    }
  
    function init() {
      if (ready) return
      overlay = byId('eqedOverlay')
      canvas = byId('eqedCanvas')
      preview = byId('eqedPreview')
      paletteEl = byId('eqedPalette')
      ribbonEl = byId('eqedRibbon')
      if (!overlay || !canvas) return
  
      buildRibbon()
      buildPalette()
      ready = true
  
      canvas.addEventListener('input', schedulePreview)
      canvas.addEventListener('keyup', schedulePreview)
      canvas.addEventListener('click', function (e) {
        // Clicking empty canvas places a text slot if empty
        if (canvas.childNodes.length === 0) {
          var s = makeSlot('')
          canvas.appendChild(s)
          s.focus()
        }
      })
  
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) close()
      })
      document.addEventListener('keydown', function (e) {
        if (!overlay.classList.contains('eqed-open')) return
        if (e.key === 'Escape') {
          e.preventDefault()
          close()
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault()
          commit()
        }
      })
  
      document.querySelectorAll('input[name="eqedMode"]').forEach(function (r) {
        r.addEventListener('change', function () {
          if (r.checked) setMode(r.value)
        })
      })
  
      document.addEventListener('focusin', function (e) {
        rememberFocus(e.target)
      })
      document.addEventListener('selectionchange', function () {
        var el = document.activeElement
        if (isTextField(el) && !el.isContentEditable && typeof el.selectionStart === 'number') {
          lastInputSel = { start: el.selectionStart, end: el.selectionEnd }
          lastFocused = el
        }
      })
  
      document.addEventListener(
        'mousedown',
        function (e) {
          var btn = e.target.closest('[data-eq-target]')
          if (!btn) return
          e.preventDefault()
          var sel = btn.getAttribute('data-eq-target')
          var t = document.querySelector(sel) || byId(String(sel).replace(/^#/, ''))
          if (t) captureSelection(t)
        },
        true
      )
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-eq-target]')
        if (!btn) return
        e.preventDefault()
        open(btn.getAttribute('data-eq-target'))
      })
  
      enhanceAll()
    }
  
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init)
    } else {
      init()
    }
  
    if (typeof MutationObserver !== 'undefined') {
      document.addEventListener('DOMContentLoaded', function () {
        var obs = new MutationObserver(function (mutations) {
          var needs = false
          mutations.forEach(function (m) {
            m.addedNodes &&
              m.addedNodes.forEach(function (n) {
                if (n.nodeType === 1 && ((n.matches && n.matches('[data-eq-field]')) || (n.querySelector && n.querySelector('[data-eq-field]')))) needs = true
              })
          })
          if (needs) enhanceAll()
        })
        obs.observe(document.body, { childList: true, subtree: true })
      })
    }
  
    window.EqEditor = {
      open: open,
      close: close,
      commit: commit,
      setMode: setMode,
      clearInput: clearInput,
      updatePreview: updatePreview,
      enhance: enhance,
      enhanceAll: enhanceAll,
      captureSelection: captureSelection,
      setCategory: setCategory
    }
  })()
</script>

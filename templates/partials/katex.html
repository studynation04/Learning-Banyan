<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous" />
<style>
  /* KaTeX matches surrounding text size exactly */
  .katex { font-size: 1em !important; line-height: inherit !important; }
  .katex-display { margin: 0.5em 0 !important; overflow-x: auto; overflow-y: hidden; }
  .katex-display > .katex { font-size: 1.05em !important; }
</style>
<script>
  (function () {
    if (window.__katexLoaderStarted) return;
    window.__katexLoaderStarted = true;

    function loadScript(src, id) {
      return new Promise(function (resolve, reject) {
        if (id && document.getElementById(id)) { resolve(); return; }
        var s = document.createElement("script");
        if (id) s.id = id;
        s.src = src;
        s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { reject(new Error("Failed to load " + src)); };
        document.head.appendChild(s);
      });
    }

    var KATEX_JS = "https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js";
    var AUTO_JS = "https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js";

    window.__katexReady = loadScript(KATEX_JS, "KaTeX-script")
      .then(function () { return loadScript(AUTO_JS, "KaTeX-auto-render"); })
      .catch(function (e) { console.warn(e); });

    var DELIMS = [
      { left: "$$", right: "$$", display: true },
      { left: "\\[", right: "\\]", display: true },
      { left: "$", right: "$", display: false },
      { left: "\\(", right: "\\)", display: false },
    ];

    window.eqTypeset = function (elements) {
      function run() {
        if (typeof renderMathInElement !== "function") return;
        var list;
        if (!elements) list = [document.body];
        else if (elements.length !== undefined && !elements.tagName)
          list = Array.prototype.slice.call(elements);
        else list = [elements];

        list.forEach(function (el) {
          if (!el || !el.querySelectorAll) return;
          try {
            renderMathInElement(el, {
              delimiters: DELIMS,
              throwOnError: false,
              strict: "ignore",
              trust: false,
              ignoredTags: [
                "script", "noscript", "style", "textarea", "pre", "code",
                "option", "kbd", "samp",
              ],
            });
          } catch (err) { /* ignore */ }
        });
        // After KaTeX, re-normalize any equation PNGs to 1.25em
        if (typeof window.eqSizeInlineImages === "function") {
          list.forEach(function (el) {
            try { window.eqSizeInlineImages(el); } catch (e) {}
          });
        }
      }

      if (window.__katexReady && window.__katexReady.then) {
        return window.__katexReady.then(run);
      }
      run();
      return Promise.resolve();
    };

    document.addEventListener("DOMContentLoaded", function () {
      window.eqTypeset();
    });
  })();
</script>

# Optional. Only use this if you later want nginx in front of Gunicorn.
# Default install does NOT touch nginx, so your existing IPv4:80 site stays.
#
# Copy to: /etc/nginx/sites-available/learning-banyan
# Then: ln -s /etc/nginx/sites-available/learning-banyan /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx
#
# Listen on 8080 only. Never listen 80/443 here.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 100M;

    location /static/ {
        alias REPLACE_APP_DIR/staticfiles/;
    }

    location /media/ {
        alias REPLACE_APP_DIR/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}
